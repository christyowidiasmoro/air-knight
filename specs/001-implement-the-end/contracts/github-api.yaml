openapi: 3.0.3
info:
  title: CI/CD Build System API
  description: GitHub Actions workflow integration for automated builds and deployments
  version: 1.0.0
  contact:
    name: Air Knight Development Team

servers:
  - url: https://api.github.com
    description: GitHub API v4

paths:
  /repos/{owner}/{repo}/actions/workflows:
    get:
      summary: List repository workflows
      description: Get all GitHub Actions workflows for the repository
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
          description: Repository owner username
        - name: repo
          in: path
          required: true
          schema:
            type: string
          description: Repository name
      responses:
        '200':
          description: List of workflows
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_count:
                    type: integer
                  workflows:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workflow'

  /repos/{owner}/{repo}/actions/workflows/{workflow_id}/runs:
    get:
      summary: List workflow runs
      description: Get workflow runs for a specific workflow
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: workflow_id
          in: path
          required: true
          schema:
            type: integer
        - name: branch
          in: query
          schema:
            type: string
          description: Filter runs by branch
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, in_progress, completed]
          description: Filter runs by status
      responses:
        '200':
          description: List of workflow runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_count:
                    type: integer
                  workflow_runs:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkflowRun'
    
    post:
      summary: Trigger workflow
      description: Manually trigger a workflow run
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: workflow_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ref:
                  type: string
                  description: Git branch or tag to run workflow on
                inputs:
                  type: object
                  description: Workflow input parameters
              required:
                - ref
      responses:
        '204':
          description: Workflow triggered successfully

  /repos/{owner}/{repo}/actions/runs/{run_id}/artifacts:
    get:
      summary: List workflow run artifacts
      description: Get artifacts generated by a workflow run
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: run_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of artifacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_count:
                    type: integer
                  artifacts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Artifact'

  /repos/{owner}/{repo}/releases:
    get:
      summary: List releases
      description: Get repository releases
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: per_page
          in: query
          schema:
            type: integer
            default: 30
            maximum: 100
      responses:
        '200':
          description: List of releases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Release'
    
    post:
      summary: Create release
      description: Create a new release
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tag_name:
                  type: string
                  description: Git tag name
                name:
                  type: string
                  description: Release name
                body:
                  type: string
                  description: Release description/notes
                draft:
                  type: boolean
                  default: false
                prerelease:
                  type: boolean
                  default: false
                target_commitish:
                  type: string
                  description: Branch or commit to create release from
              required:
                - tag_name
      responses:
        '201':
          description: Release created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'

  /repos/{owner}/{repo}/pages:
    get:
      summary: Get GitHub Pages information
      description: Get the current GitHub Pages configuration and status
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pages configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagesConfiguration'

components:
  schemas:
    Workflow:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        path:
          type: string
        state:
          type: string
          enum: [active, deleted, disabled_fork, disabled_inactivity, disabled_manually]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        url:
          type: string
          format: uri
        html_url:
          type: string
          format: uri

    WorkflowRun:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        head_branch:
          type: string
        head_sha:
          type: string
          pattern: '^[a-f0-9]{40}$'
        status:
          type: string
          enum: [queued, in_progress, completed]
        conclusion:
          type: string
          enum: [success, failure, neutral, cancelled, skipped, timed_out, action_required]
          nullable: true
        workflow_id:
          type: integer
        url:
          type: string
          format: uri
        html_url:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        run_started_at:
          type: string
          format: date-time
        event:
          type: string
        actor:
          $ref: '#/components/schemas/User'

    Artifact:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        size_in_bytes:
          type: integer
        url:
          type: string
          format: uri
        archive_download_url:
          type: string
          format: uri
        expired:
          type: boolean
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Release:
      type: object
      properties:
        id:
          type: integer
        tag_name:
          type: string
        target_commitish:
          type: string
        name:
          type: string
        body:
          type: string
        draft:
          type: boolean
        prerelease:
          type: boolean
        created_at:
          type: string
          format: date-time
        published_at:
          type: string
          format: date-time
          nullable: true
        author:
          $ref: '#/components/schemas/User'
        assets:
          type: array
          items:
            $ref: '#/components/schemas/ReleaseAsset'
        tarball_url:
          type: string
          format: uri
        zipball_url:
          type: string
          format: uri
        html_url:
          type: string
          format: uri

    ReleaseAsset:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        label:
          type: string
          nullable: true
        content_type:
          type: string
        state:
          type: string
          enum: [uploaded, open]
        size:
          type: integer
        download_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        browser_download_url:
          type: string
          format: uri

    PagesConfiguration:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: GitHub Pages site URL
        status:
          type: string
          enum: [built, building, errored]
        cname:
          type: string
          nullable: true
          description: Custom domain
        source:
          type: object
          properties:
            branch:
              type: string
            path:
              type: string
              enum: ["/", "/docs"]

    User:
      type: object
      properties:
        id:
          type: integer
        login:
          type: string
        avatar_url:
          type: string
          format: uri
        html_url:
          type: string
          format: uri

  securitySchemes:
    github_token:
      type: http
      scheme: bearer
      description: GitHub Personal Access Token or GitHub App token

security:
  - github_token: []